// Build script for BoostCraft (Fabric Loom)
// Java toolchain: 21
// Minecraft: 1.21.1

plugins {
    id 'fabric-loom' version '1.3.7'
    id 'maven-publish'
    id 'java'
}

group = 'com.luxandriy'
version = '1.0.0'
archivesBaseName = 'boostcraft'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

def minecraft_version = '1.21.1'
def yarn_mappings = '1.21.1+build.12'
def loader_version = '0.14.25'
def fabric_api_version = '0.92.0+1.21.1'

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"

    // Fabric loader/mod dependencies
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

loom {
    // Additional loom configuration can go here
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
